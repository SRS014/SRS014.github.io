<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title>Procurement Approvals: solution architecture</title>
  <desc>Requesters and three approvers use one canvas app on a laptop or phone. The app reads and writes six Dataverse tables. Flow 1 is called by the app on submit; Flows 2, 3 and 4 are triggered by Dataverse when an approval is decided, an approval step is created, or a purchase order is approved. The flows send email and calendar events through Office 365 Outlook. A Playwright suite tests the published app and checks Dataverse.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#209CCB"/><stop offset="0.5" stop-color="#742774"/><stop offset="1" stop-color="#E3008C"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B5F7E"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#742774"/>
    </marker>
    <style>
      .h { font-family: Manrope, 'Segoe UI', Arial, sans-serif; font-weight: 700; fill: #0F2530; }
      .t { fill: #0F2530; font-size: 13px; }
      .m { fill: #51646E; font-size: 12px; }
      .mono { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12px; fill: #0B5F7E; }
      .card { fill: #FFFFFF; stroke: #CBE2EC; stroke-width: 1.5; }
      .flow { fill: #F3E9F3; stroke: #742774; stroke-width: 1.5; }
      .app { fill: #E3F0F5; stroke: #0B5F7E; stroke-width: 1.5; }
      .zone { fill: none; stroke: #209CCB; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .lbl { font-size: 11px; fill: #0B5F7E; font-weight: 600; }
      .lblp { font-size: 11px; fill: #742774; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="770" fill="#EDF7FB"/>
  <rect width="1280" height="6" fill="url(#brand)"/>
  <text x="40" y="48" class="h" font-size="22">Procurement Approvals: solution architecture</text>
  <text x="40" y="72" class="m" font-size="13">One canvas app on Dataverse, with four Power Automate flows doing the routing. Under SAR 50,000: manager only. At or above: manager, finance, procurement.</text>

  <!-- People -->
  <rect x="40" y="110" width="200" height="104" rx="10" class="card"/>
  <text x="58" y="140" class="h" font-size="15">Requester</text>
  <text x="58" y="162" class="m">Raises a PO, tracks it,</text>
  <text x="58" y="178" class="m">revises if rejected</text>
  <text x="58" y="198" class="m">Laptop or phone</text>

  <rect x="40" y="236" width="200" height="124" rx="10" class="card"/>
  <text x="58" y="266" class="h" font-size="15">Approvers</text>
  <text x="58" y="288" class="m">1 · Department manager</text>
  <text x="58" y="306" class="m">2 · Finance Director</text>
  <text x="58" y="324" class="m">3 · Procurement Head</text>
  <text x="58" y="344" class="m">Email link opens the PO</text>

  <!-- Environment zone -->
  <rect x="290" y="96" width="720" height="560" rx="14" class="zone"/>
  <text x="306" y="118" class="lbl">POWER PLATFORM DEVELOPER ENVIRONMENT · SOLUTION VendorProcurementPoC</text>

  <!-- Canvas app -->
  <rect x="320" y="136" width="300" height="190" rx="10" class="app"/>
  <text x="338" y="166" class="h" font-size="16">Canvas app</text>
  <text x="338" y="186" class="m">Procurement Approvals · 5 screens</text>
  <text x="338" y="212" class="t">Home · New PO · Purchase orders</text>
  <text x="338" y="232" class="t">PO detail (chain, decide, audit)</text>
  <text x="338" y="252" class="t">Vendors (CR, VAT, risk, status)</text>
  <text x="338" y="278" class="m">Fusion Sky design · responsive to phone</text>
  <text x="338" y="298" class="m">Source: .pa.yaml generated by gen_app.py</text>
  <text x="338" y="316" class="m">Approve / Reject writes the Approval row</text>

  <!-- Dataverse -->
  <rect x="680" y="136" width="300" height="250" rx="10" class="card"/>
  <text x="698" y="166" class="h" font-size="16">Dataverse</text>
  <text x="698" y="186" class="m">6 tables · 7 choices · 10 lookups</text>
  <text x="698" y="214" class="mono">Purchase Order</text><text x="830" y="214" class="m">PO-YYYYMM-########</text>
  <text x="698" y="236" class="mono">Approval</text><text x="830" y="236" class="m">one row per step</text>
  <text x="698" y="258" class="mono">PO Activity</text><text x="830" y="258" class="m">audit trail</text>
  <text x="698" y="280" class="mono">Vendor</text><text x="830" y="280" class="m">CR, VAT, risk, status</text>
  <text x="698" y="302" class="mono">Department</text><text x="830" y="302" class="m">manager, budget</text>
  <text x="698" y="324" class="mono">Team Member</text><text x="830" y="324" class="m">personas, roles</text>
  <text x="698" y="352" class="m">Env variables: finance threshold (SAR 50,000),</text>
  <text x="698" y="370" class="m">app link for email deep links</text>

  <!-- App to Dataverse -->
  <line x1="620" y1="230" x2="676" y2="230" stroke="#0B5F7E" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="676" y1="250" x2="624" y2="250" stroke="#0B5F7E" stroke-width="2" marker-end="url(#arr)"/>
  <text x="626" y="222" class="lbl">read</text><text x="634" y="268" class="lbl">write</text>

  <!-- People to app -->
  <line x1="240" y1="162" x2="316" y2="200" stroke="#0B5F7E" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="298" x2="316" y2="270" stroke="#0B5F7E" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Flows -->
  <rect x="320" y="420" width="660" height="214" rx="10" class="card"/>
  <text x="338" y="448" class="h" font-size="16">Power Automate: 4 flows</text>
  <rect x="338" y="464" width="300" height="74" rx="8" class="flow"/>
  <text x="352" y="486" class="t" font-weight="700">1 · VpaPOSubmitted</text>
  <text x="352" y="504" class="m">Power Apps trigger (Submit)</text>
  <text x="352" y="522" class="m">Checks draft, sets route, opens step 1</text>
  <rect x="660" y="464" width="300" height="74" rx="8" class="flow"/>
  <text x="674" y="486" class="t" font-weight="700">2 · VpaApprovalDecision</text>
  <text x="674" y="504" class="m">Dataverse: approval decided</text>
  <text x="674" y="522" class="m">Next step, or Approved / Rejected</text>
  <rect x="338" y="548" width="300" height="74" rx="8" class="flow"/>
  <text x="352" y="570" class="t" font-weight="700">3 · VpaApprovalRequested</text>
  <text x="352" y="588" class="m">Dataverse: approval step created</text>
  <text x="352" y="606" class="m">Budget check (finance), email approver</text>
  <rect x="660" y="548" width="300" height="74" rx="8" class="flow"/>
  <text x="674" y="570" class="t" font-weight="700">4 · VpaPOApproved</text>
  <text x="674" y="588" class="m">Dataverse: PO status = Approved</text>
  <text x="674" y="606" class="m">Summary email, calendar slot, audit row</text>

  <!-- App to flow 1, Dataverse triggers -->
  <line x1="420" y1="326" x2="420" y2="460" stroke="#742774" stroke-width="2" marker-end="url(#arrp)"/>
  <text x="428" y="400" class="lblp">Run() on Submit</text>
  <line x1="830" y1="386" x2="830" y2="460" stroke="#742774" stroke-width="2" marker-end="url(#arrp)"/>
  <text x="838" y="424" class="lblp">row triggers</text>

  <!-- Outlook -->
  <rect x="1050" y="430" width="190" height="124" rx="10" class="card"/>
  <text x="1068" y="460" class="h" font-size="15">Office 365 Outlook</text>
  <text x="1068" y="482" class="m">Approval requests</text>
  <text x="1068" y="500" class="m">Progress / rejection</text>
  <text x="1068" y="518" class="m">Approved summary</text>
  <text x="1068" y="536" class="m">Calendar slot (Sun–Thu)</text>
  <line x1="980" y1="527" x2="1046" y2="500" stroke="#742774" stroke-width="2" marker-end="url(#arrp)"/>
  <path d="M1145,430 C1145,380 260,380 240,330" fill="none" stroke="#209CCB" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="1060" y="396" class="lbl">email link opens the PO</text>

  <!-- Testing -->
  <rect x="1050" y="136" width="190" height="186" rx="10" class="card"/>
  <text x="1068" y="166" class="h" font-size="15">Playwright tests</text>
  <text x="1068" y="188" class="m">Drive the published app</text>
  <text x="1068" y="206" class="m">as every persona</text>
  <text x="1068" y="228" class="m">Check each flow's result</text>
  <text x="1068" y="246" class="m">in Dataverse</text>
  <text x="1068" y="268" class="m">Record the demo video</text>
  <text x="1068" y="296" class="mono">testing/e2e</text>
  <line x1="1046" y1="230" x2="984" y2="230" stroke="#0B5F7E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="40" y="700" class="m">Provisioning (schema, seed, flows) is scripted through the Dataverse Web API. Source: github.com/SRS014/procurement-approvals-power-platform</text>
  <text x="40" y="722" class="m">All people, vendors and purchase orders are fictional sample data. The Fusion Platform by Sohan.</text>
</svg>
